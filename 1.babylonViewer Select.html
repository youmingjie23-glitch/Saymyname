  <title>Models | Say My Name</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root{
      --bg:#0b1220;
      --bg2:#121b33;
      --text:#fff;
      --muted:#aab4c7;
    }

    body{
      font-family:"Segoe UI",Arial;
      background:linear-gradient(135deg,var(--bg),var(--bg2));
      color:var(--text);
    }

    .container{width:min(1200px,90%);margin:auto}

    nav{
      padding:20px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .nav-links a{
      margin-left:20px;
      color:var(--muted);
    }

    .nav-links a.active,
    .nav-links a:hover{color:#fff}

    h1{margin:30px 0 20px;font-size:2.2rem}

    /* ===== 卡片展示（像 Sketchfab） ===== */
    .model-list{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:22px;
      padding-bottom:40px;
    }

    .model-card{
      display:block;
      border-radius:14px;
      overflow:hidden;
      background:#111;
      cursor:pointer;
      transition:.25s;
    }

    .model-card:hover{
      transform:translateY(-6px);
      box-shadow:0 15px 30px rgba(0,0,0,.4);
    }

    .thumb{
      width:100%;
      height:180px;
      background-size:cover;
      background-position:center;
    }

    .model-info{
      background:#fff;
      color:#111;
      padding:10px 14px;
    }

    .model-info h3{
      font-size:.9rem;
      margin-bottom:4px;
    }

    .meta{
      font-size:.8rem;
      color:#666;
    }

    footer{
      text-align:center;
      color:var(--muted);
      padding:30px 0;
    }

    @media(max-width:1000px){
      .model-list{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:600px){
      .model-list{grid-template-columns:1fr}
    }
  </style>
</head>

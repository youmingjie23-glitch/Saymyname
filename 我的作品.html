<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Works | Say My Name</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root{
      --bg:#0b1220;
      --bg2:#121b33;
      --text:#fff;
      --muted:#aab4c7;
    }

    body{
      font-family:"Segoe UI",Arial;
      background:linear-gradient(135deg,var(--bg),var(--bg2));
      color:var(--text);
    }

    .container{width:min(1200px,90%);margin:auto}

    nav{
      padding:20px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .nav-links a{
      margin-left:20px;
      color:var(--muted);
    }

    .nav-links a.active,
    .nav-links a:hover{color:#fff}

    h1{margin:30px 0 20px;font-size:2.2rem}

    .works-list{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:22px;
      padding-bottom:40px;
    }

    .work-card{
      border-radius:14px;
      overflow:hidden;
      background:#111;
      transition:.25s;
    }

    .work-card:hover{
      transform:translateY(-6px);
      box-shadow:0 15px 30px rgba(0,0,0,.4);
    }

    .viewer-box iframe{
      width:100%;
      height:180px;
      border:none;
      pointer-events:none;
    }

    .work-card:hover iframe{
      pointer-events:auto;
    }

    .work-info{
      background:#fff;
      color:#111;
      padding:10px 14px;
    }

    .work-info h3{
      font-size:.9rem;
      margin-bottom:4px;
    }

    .meta{
      font-size:.8rem;
      color:#666;
    }

    footer{
      text-align:center;
      color:var(--muted);
      padding:30px 0;
    }

    @media(max-width:1000px){
      .works-list{grid-template-columns:repeat(2,1fr)}
    }

    @media(max-width:600px){
      .works-list{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<nav class="container">
  <div>SayMyName</div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="我的作品.html" class="active">Works</a>
    <a href="1.babylonViewer Select.html">Models</a>
    <a href="2.babylonViewer Navbar.html">VR</a>
  </div>
</nav>

<div class="container">
  <h1>Works</h1>

  <div class="works-list">

    <!-- Panda -->
    <div class="work-card">
      <div class="viewer-box">
        <iframe 
          src="https://sketchfab.com/models/25d85c17e75546049deae047bdb7a4f6/embed"
          allow="autoplay; fullscreen; xr-spatial-tracking"
          allowfullscreen>
        </iframe>
      </div>
      <div class="work-info">
        <h3>Cute Panda</h3>
        <div class="meta">Sketchfab Animation</div>
      </div>
    </div>

    <!-- Dancing -->
    <div class="work-card">
      <div class="viewer-box">
        <iframe 
          src="https://sketchfab.com/models/dacc5dc0648f41b18ff8170b618a7b8e/embed"
          allow="autoplay; fullscreen; xr-spatial-tracking"
          allowfullscreen>
        </iframe>
      </div>
      <div class="work-info">
        <h3>Dancing</h3>
        <div class="meta">Sketchfab Animation</div>
      </div>
    </div>

  </div>
</div>

<footer>
  © 2026 SayMyName Works
</footer>

</body>
</html>
